<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaput - Privacy Wallet</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: #1a1a1a;
            color: #ffffff;
        }
        .container {
            background: #2a2a2a;
            border-radius: 12px;
            padding: 24px;
            margin: 20px 0;
        }
        button {
            background: #6c5ce7;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin: 8px;
        }
        button:hover {
            background: #5f3dc4;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #444;
            background: #333;
            color: white;
        }
        .address {
            background: #333;
            padding: 12px;
            border-radius: 8px;
            margin: 8px 0;
            word-break: break-all;
        }
        .status {
            padding: 8px;
            border-radius: 4px;
            margin: 4px 0;
        }
        .success {
            background: #00b894;
            color: white;
        }
        .info {
            background: #0984e3;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Kaput Privacy Wallet</h1>
    <p>Privacy-preserving wallet with auto-sweep to Arbitrum</p>
    
    <div class="container">
        <h2>Wallet Connection</h2>
        <button onclick="connectWallet()">Connect Wallet</button>
        <div id="walletAddress" class="address"></div>
    </div>
    
    <div class="container">
        <h2>Generate Deposit Address</h2>
        <button onclick="generateDepositAddress()">Generate New Address</button>
        <div id="depositAddress" class="address"></div>
        <div class="status info">Share this address to receive deposits</div>
    </div>
    
    <div class="container">
        <h2>Deposit</h2>
        <input type="number" id="depositAmount" placeholder="Amount in ETH" step="0.01">
        <button onclick="deposit()">Deposit and Auto-Sweep</button>
    </div>
    
    <div class="container">
        <h2>Withdraw to Arbitrum</h2>
        <input type="text" id="arbitrumAddress" placeholder="Arbitrum wallet address">
        <button onclick="withdrawToArbitrum()">Withdraw to Arbitrum</button>
    </div>
    
    <div class="container">
        <h2>Transaction History</h2>
        <div id="history"></div>
    </div>

    <script src="./app.js"></script>
</body>
</html>
