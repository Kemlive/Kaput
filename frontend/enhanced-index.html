<!DOCTYPE html>
<html>
<head>
    <title>Kaput - Privacy Wallet</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
</head>
<body>
    <h1>🕵️ Kaput Privacy Wallet</h1>
    <p>Connected to private node via Tor</p>
    
    <button onclick="initializeWallet()">Initialize Wallet</button>
    <div id="status"></div>
    <div id="walletInfo"></div>
    
    <script src="./rpc-config.js"></script>
    <script src="./enhanced-privacy-wallet.js"></script>
    <script>
        async function initializeWallet() {
            document.getElementById('status').textContent = 'Connecting...';
            
            try {
                await enhancedWallet.init();
                document.getElementById('status').textContent = 
                    `✅ Connected via ${enhancedWallet.connectionMode}`;
            } catch (error) {
                document.getElementById('status').textContent = 
                    `❌ Connection failed: ${error.message}`;
            }
        }
    </script>
</body>
</html>
