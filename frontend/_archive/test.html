<!DOCTYPE html>
<html>
<head>
    <title>Kaput Test</title>
</head>
<body>
    <h1>Test Page</h1>
    <button onclick="test()">Test Connection</button>
    <div id="result"></div>
    
    <script>
        async function test() {
            document.getElementById('result').textContent = 'Testing...';
            
            try {
                const response = await fetch('https://eth.llamarpc.com', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        jsonrpc: '2.0',
                        method: 'eth_blockNumber',
                        params: [],
                        id: 1
                    })
                });
                
                const data = await response.json();
                document.getElementById('result').textContent = 
                    '✅ Connected! Block: ' + parseInt(data.result, 16);
            } catch (error) {
                document.getElementById('result').textContent = 
                    '❌ Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
