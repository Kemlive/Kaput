<!DOCTYPE html>
<html>
<head>
    <title>Kaput - Privacy Wallet</title>
    <script src="./ethers.min.js"></script>
</head>
<body>
    <h1>🕵️ Kaput Privacy Wallet</h1>
    <button onclick="init()">Initialize</button>
    <div id="status"></div>
    <script src="./secure-wallet.js"></script>
    <script>
        async function init() {
            const provider = new ethers.providers.JsonRpcProvider('http://127.0.0.1:8545');
            try {
                const block = await provider.getBlockNumber();
                document.getElementById('status').textContent = '✅ Local node. Block: ' + block;
            } catch(e) {
                document.getElementById('status').textContent = '❌ Need SSH tunnel to node';
            }
        }
    </script>
</body>
</html>
